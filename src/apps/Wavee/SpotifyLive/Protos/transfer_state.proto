// Capture-verified subset of Spotify's Connect TransferState wire schema.
syntax = "proto3";

package transfer;
option optimize_for = CODE_SIZE;
option csharp_namespace = "Wavee.Protocol.Transfer";

message TransferState {
  TransferPlayerOptions options = 1;
  TransferPlayback playback = 2;
  TransferSession current_session = 3;
  TransferQueue queue = 4;
}

message TransferPlayerOptions {
  bool shuffling_context = 1;
  bool repeating_context = 2;
  bool repeating_track = 3;
}

message TransferPlayback {
  int64 timestamp = 1;
  int64 position_as_of_timestamp = 2;
  double speed = 3;
  bool paused = 4;
  TransferContextTrack current_track = 5;
}

message TransferSession {
  string device_id = 1;
  TransferContext context = 2;
  string current_uid = 3;
}

message TransferQueue {
  repeated TransferContextTrack tracks = 1;
  bool is_playing_queue = 2;
}

message TransferContext {
  string uri = 1;
  string url = 2;
  map<string, string> metadata = 3;
  bool loading = 6;
}

message TransferContextTrack {
  string uri = 1;
  string uid = 2;
  bytes gid = 3;
  map<string, string> metadata = 4;
}

