# Codex config for this repo.
#
# Hard filesystem deny rules were REMOVED (2026-07-25): they interacted badly with
# Windows path casing (C:\WAVEE vs C:\wavee) and caused workspace writes to fail
# closed as "blocked by policy" even under Full Access / danger-full-access.
#
# PlayPlay/native material is not fenced from agents; it is kept OUT OF COMMITS by
# .gitignore + .githooks/pre-commit + the CI no-drm-material workflow. It is committed
# only in the private wavee-playplay-private repo.
#
# Do NOT reintroduce default_permissions / [permissions.*] deny tables here unless
# you have verified Windows path identity is stable for the session root. Prefer
# user-level ~/.codex/config.toml sandbox_mode = "danger-full-access" (already set).
